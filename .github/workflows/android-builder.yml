name: android-builder
# Builds the MeeLano Builder app itself -> installable APK (also published to releases/).
on:
  push:
    paths: ["android/**", ".github/workflows/android-builder.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      signing: ${{ steps.signing.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle :app:assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: MeeLano-Builder-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to branch
        run: |
          git pull --rebase || true
          mkdir -p releases
          cp android/app/build/outputs/apk/debug/app-debug.apk releases/MeeLano-Builder.apk
          cp android/version.json releases/version.json
          git config user.name "meelano-bot"
          git config user.email "bot@meelano.local"
          git add -f releases/MeeLano-Builder.apk releases/version.json
          git diff --cached --quiet && echo "APK unchanged" || (git commit -m "Publish MeeLano Builder APK (run ${{ github.run_number }})" && git push)
  release:
    # Signed Play-Store build. Needs repo secrets: KEYSTORE_BASE64,
    # KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (see android/README.md).
    # (secrets are unreadable in job-level `if`, so the apk job exports
    # the flag as an output instead.)
    needs: [apk]
    if: ${{ needs.apk.outputs.signing == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v3
      - run: echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - run: gradle :app:assembleRelease :app:bundleRelease --no-daemon
        working-directory: android
        env:
          KEYSTORE_FILE: ../release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: MeeLano-Builder-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
      - name: Publish release APK to branch
        run: |
          git pull --rebase || true
          mkdir -p releases
          cp android/app/build/outputs/apk/release/app-release.apk releases/MeeLano-Builder-release.apk
          git config user.name "meelano-bot"
          git config user.email "bot@meelano.local"
          git add -f releases/MeeLano-Builder-release.apk
          git diff --cached --quiet && echo "APK unchanged" || (git commit -m "Publish MeeLano Builder release APK (run ${{ github.run_number }})" && git push)
