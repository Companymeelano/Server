name: server
on:
  push:
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r server/requirements.txt
      - run: mkdir -p releases && python -m pytest server/tests/ -q 2>&1 | tee releases/pytest-last.log; test ${PIPESTATUS[0]} -eq 0
      - name: Publish test log on failure
        if: failure()
        run: |
          git config user.name "meelano-bot"
          git config user.email "bot@meelano.local"
          git add -f releases/pytest-last.log
          git commit -m "CI: pytest failure log (run ${{ github.run_number }})" && git push
